<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8faf5">
  <title>Trace, Copy, Cover, Close | Bright Steps</title>
  <style>
    :root{--paper:#f8faf5;--white:#fff;--ink:#17243a;--muted:#65738a;--line:#e2e8e0;--lime:#8fca22;--lime-dark:#527c08;--lime-soft:#eff8d8;--orange:#f6a34a;--orange-soft:#fff0dc;--navy:#18263b;--blue:#dceeff;--shadow:0 14px 36px rgba(31,48,65,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(980px,calc(100% - 32px));margin:0 auto;padding:22px 0 52px}.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:850;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}.top{margin:22px 0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.eyebrow{color:var(--lime-dark);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:950}.top h1{font-size:clamp(32px,5vw,48px);line-height:1;letter-spacing:-.055em;margin:8px 0}.top p{color:var(--muted);margin:0;line-height:1.5}.tutor-reset{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:10px 15px;font-weight:800;white-space:nowrap}.card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:clamp(18px,4vw,30px)}
    .setup{max-width:680px;margin:0 auto}.setup h2{margin:0 0 8px;font-size:26px;letter-spacing:-.04em}.setup p{margin:0 0 23px;color:var(--muted);line-height:1.55}.field label{display:block;font-weight:850;margin-bottom:8px}.field input{width:100%;border:1px solid #ccd6c6;border-radius:15px;padding:14px 15px;color:var(--ink);outline:none}.field input:focus,.copy-input:focus,.memory-input:focus{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-soft)}.hint{color:var(--muted);font-size:13px;margin-top:8px}.btn{border:0;border-radius:14px;background:#eef2ea;color:var(--ink);font-weight:850;padding:12px 17px}.btn.primary{background:var(--navy);color:#fff}.btn.lime{background:var(--lime);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.setup .btn{margin-top:18px;width:100%}.error{min-height:20px;color:#b84c2b;font-size:13px;margin-top:7px}.progress-wrap{margin:0 0 17px;display:flex;align-items:center;gap:13px}.progress-label{font-size:13px;font-weight:850;color:var(--muted);white-space:nowrap}.progress{height:8px;background:#e8ede4;border-radius:99px;overflow:hidden;flex:1}.progress span{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s ease}.word-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 19px;background:var(--navy);border-radius:19px;color:#fff;margin-bottom:17px}.word-banner small{display:block;color:#c9d4e1;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.word-banner strong{display:block;font-size:clamp(28px,5vw,40px);letter-spacing:.04em;margin-top:3px}.word-banner .hidden-word{color:#b8d7ef;letter-spacing:.12em}.say-check{margin-bottom:17px;background:var(--orange-soft);border:1px solid #f8dfbc;border-radius:17px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}.say-check p{margin:0;color:#5d4a32;line-height:1.45;font-size:14px}.say-check b{display:block;color:var(--ink);margin-bottom:3px}.say-check.confirmed{background:var(--lime-soft);border-color:#d8eaba}.say-check.confirmed p{color:#4e6530}
    .steps{display:grid;gap:12px}.step-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:17px;border:1px solid var(--line);border-radius:21px;padding:17px;background:#fff;transition:border-color .2s ease,background .2s ease}.step-row.active{border-color:#b4d77e;background:#fcfef8}.step-row.done{background:#f7faef}.step-row.locked{opacity:.72}.step-aside{display:flex;gap:12px;align-items:flex-start}.step-number{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#edf1eb;font-weight:950;color:#71806a}.step-row.active .step-number{background:var(--lime);color:white}.step-row.done .step-number{background:var(--lime-soft);color:var(--lime-dark)}.step-title{font-size:17px;font-weight:950;letter-spacing:-.02em;margin:2px 0 4px}.step-sub{color:var(--muted);font-size:12px;line-height:1.45}.step-content{min-width:0;align-self:center}.step-content p{color:var(--muted);margin:0 0 12px;font-size:14px;line-height:1.5}.trace-word{min-height:103px;display:flex;align-items:center;justify-content:center;gap:3px;margin:0 0 13px;padding:9px 12px;background:#fafbf8;border:1px dashed #dce5d7;border-radius:16px}.trace-char{width:clamp(31px,6vw,55px);height:75px;display:grid;place-items:center}.trace-char svg{width:100%;height:100%;overflow:visible}.trace-char text{font-family:"Comic Sans MS","Trebuchet MS",cursive;font-size:64px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:transparent;stroke:#b8c4b2;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:2.7 2.7}.trace-char.completed text{fill:var(--lime-dark);stroke:var(--lime-dark);stroke-dasharray:none}.trace-char.current text{stroke:#e59335;stroke-dasharray:1;stroke-dashoffset:1;animation:draw-letter .85s ease forwards;fill:transparent}.trace-char.current.finished text{fill:#b36c10;transition:fill .2s ease}.trace-char.pending text{animation:none;stroke-dasharray:2.7 2.7;stroke-dashoffset:0}@keyframes draw-letter{to{stroke-dashoffset:0}}.trace-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.dot-action{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font-weight:850;text-align:left;padding:0}.dot{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--orange);box-shadow:0 4px 0 #df8730;color:#fff;font-size:20px;transition:transform .15s ease}.dot-action:hover .dot{transform:scale(1.06)}.counter{font-size:13px;color:var(--muted);font-weight:800}.word-example{font-size:30px;font-weight:950;letter-spacing:.1em;color:var(--lime-dark);padding:10px 12px;background:#fafbf8;border-radius:14px;text-align:center;margin:0 0 12px}.copy-line{display:flex;align-items:center;gap:10px}.copy-input,.memory-input{width:100%;min-width:0;border:1px solid #ccd6c6;border-radius:13px;padding:13px 14px;outline:none;font-size:21px;letter-spacing:.12em;font-weight:850;color:var(--ink)}.copy-help{font-size:12px;color:var(--muted);margin:8px 0 0!important}.memory-stage{padding:16px;border:1px dashed #d8dfd4;background:#fafbf8;border-radius:16px}.memory-stage .memory-input{background:white}.feedback{font-size:13px;line-height:1.45;margin:9px 0 0!important;font-weight:750}.feedback.good{color:var(--lime-dark)}.feedback.try{color:#a65c11}.feedback.correction{background:#fff0dc;padding:11px 13px;border-radius:12px;color:#654d2f}.hidden-reminder{font-size:13px;background:#edf4fa;color:#3d5971;padding:11px 13px;border-radius:12px;margin-bottom:11px}.oral-prompt{font-size:16px;font-weight:800;line-height:1.5;padding:17px;background:#f3f6ef;border-radius:15px;margin-bottom:13px}.finish-word{margin-top:10px}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin:17px 0 0;line-height:1.5}
    @media(max-width:650px){.shell{width:calc(100% - 24px);padding-top:14px}.top{align-items:flex-start;flex-direction:column}.tutor-reset{position:absolute;right:12px;top:14px}.top{padding-right:95px}.step-row{grid-template-columns:1fr;gap:11px;padding:15px}.step-aside{align-items:center}.step-sub{font-size:12px}.say-check{align-items:flex-start;flex-direction:column}.copy-line{align-items:stretch;flex-direction:column}.copy-line .btn{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="home" href="../">← Bright Steps</a>
    <header class="top"><div><div class="eyebrow">Tutor-led spelling practice</div><h1>Trace, Copy, Cover, Close</h1><p>Learn one word at a time. Say it as you write it, then recall it from memory.</p></div><button class="tutor-reset" id="newWord" type="button" hidden>Set a new word</button></header>
    <div id="app"></div>
    <p class="footer-note">The tutor listens and confirms spoken reading and spelling. The activity does not record or score speech.</p>
  </main>
  <script>
  (()=>{
    const app=document.getElementById('app');
    const steps=[['Trace','Watch each letter appear, then trace it with your finger.'],['Copy','Copy the word while it is still visible.'],['Cover','Hide the model and spell the word from memory.'],['Close','Close your eyes, say the word, and spell it aloud.']];
    const state={word:'',step:0,spoken:false,trace:0,animating:null,copyValue:'',coverValue:'',coverChecked:false,coverCorrected:false,closeSpoken:false};
    const letters=()=>[...state.word].filter(ch=>/[a-z]/i.test(ch));
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setup(){document.getElementById('newWord').hidden=true;app.innerHTML=`<section class="card setup"><h2>Choose the word for today</h2><p>The tutor enters a word the learner is ready to practise. Start by having the learner read it aloud; the tutor confirms before tracing begins.</p><form id="wordForm"><div class="field"><label for="targetWord">Practice word</label><input id="targetWord" name="word" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. bright" required><div class="hint">One word, up to 24 letters. Hyphens and apostrophes are okay.</div><div class="error" id="setupError" aria-live="polite"></div></div><button class="btn primary" type="submit">Begin this word</button></form></section>`;
      document.getElementById('wordForm').addEventListener('submit',e=>{e.preventDefault();const raw=document.getElementById('targetWord').value.trim();if(!/^[a-zA-Z]+(?:['-][a-zA-Z]+)*$/.test(raw)){document.getElementById('setupError').textContent='Enter one word using letters, with an optional apostrophe or hyphen.';return}state.word=raw.toLowerCase();state.step=0;state.spoken=false;state.trace=0;state.animating=null;state.copyValue='';state.coverValue='';state.coverChecked=false;state.coverCorrected=false;state.closeSpoken=false;render()})}
    function wordBanner(){return `<div class="word-banner"><div><small>Today's word</small><strong class="${state.step>=2?'hidden-word':''}">${state.step>=2?'••••••':esc(state.word)}</strong></div><span aria-hidden="true" style="font-size:28px">${state.step>=2?'◌':'✦'}</span></div>`}
    function spokenCheck(){return `<div class="say-check ${state.spoken?'confirmed':''}"><p><b>${state.spoken?'Word read aloud ✓':'First, read the word aloud'}</b>${state.spoken?'The tutor has confirmed the learner said the word correctly.':'Look at the word together. The tutor listens, then confirms the learner read it correctly.'}</p>${state.spoken?'':`<button class="btn" type="button" data-action="confirm-read">Tutor confirms</button>`}</div>`}
    function traceGlyphs(){let n=0;return [...state.word].map(ch=>{if(!/[a-z]/i.test(ch))return `<span aria-hidden="true" style="font-size:34px;color:#9aaa91">${esc(ch)}</span>`;const i=n++;let cls='trace-char';if(i<state.trace)cls+=' completed';else if(i===state.trace&&state.animating===i)cls+=' current';else cls+=' pending';return `<span class="${cls}" data-glyph="${i}" aria-label="Letter ${i+1}"><svg viewBox="0 0 64 78" aria-hidden="true"><text x="32" y="38" pathLength="1">${esc(ch)}</text></svg></span>`}).join('')}
    function traceRow(){let total=letters().length;return `<p>Say the word, then say each letter as you follow it. Click the orange dot to draw the next letter.</p><div class="trace-word" aria-label="Animated letter tracing">${traceGlyphs()}</div><div class="trace-controls">${state.trace<total?`<button class="dot-action" type="button" data-action="trace" ${state.spoken&&state.animating===null?'':'disabled'}><span class="dot" aria-hidden="true">•</span><span>${state.animating!==null?'Drawing letter…':`Draw letter ${state.trace+1}`}</span></button>`:`<span class="counter">All ${total} letters traced</span>`}<span class="counter">${Math.min(state.trace,total)} / ${total} letters</span></div>${!state.spoken?'<p class="copy-help">Confirm the spoken word above to begin.</p>':''}${state.trace>=total?'<button class="btn primary finish-word" type="button" data-action="next">Continue to Copy →</button>':''}`}
    function copyRow(){return `<p>Keep the model visible. Say the word and each letter while copying it below.</p><div class="word-example" aria-label="Word to copy">${esc(state.word)}</div><form data-form="copy"><div class="copy-line"><input class="copy-input" id="copyInput" aria-label="Copy the word" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(state.copyValue)}" placeholder="Type the word"><button class="btn primary" type="submit">Check copy</button></div></form><p class="copy-help">The tutor listens as the learner says the word and letter names.</p>${state.copyValue&&state.copyValue!==state.word?'<p class="feedback try" role="status">Check the letters and try copying the word again.</p>':''}`}
    function coverRow(){return `<p>Hide the model and say each letter while spelling the word from memory.</p><div class="hidden-reminder">The model is covered. Try spelling it without looking.</div><form data-form="cover"><div class="copy-line"><input class="memory-input" id="coverInput" aria-label="Spell the covered word" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(state.coverValue)}" placeholder="Spell it from memory"><button class="btn primary" type="submit">${state.coverChecked?'Check again':'Check spelling'}</button></div></form>${state.coverChecked&&!state.coverCorrected?`<p class="feedback correction" role="status">Compare with the model: <strong>${esc(state.word)}</strong>. Study it, cover it again, and try the whole word once more.</p><button class="btn" type="button" data-action="retry-cover">Try again from memory</button>`:''}${state.coverCorrected?'<p class="feedback good" role="status">Corrected and spelled accurately. Ready for Close.</p>':''}<p class="copy-help">If the spelling needs a fix, uncover the model, study the correct form, cover it again, and retry.</p>`}
    function closeRow(){return `<p>Close your eyes or look away. Say the word, then spell it aloud letter by letter. The tutor listens.</p><div class="oral-prompt">“Say the word. Now spell it aloud.”</div>${state.closeSpoken?`<div class="say-check confirmed"><p><b>Spoken spelling confirmed ✓</b>The learner has said the word and spelled each letter aloud.</p></div><div class="word-example" aria-label="Check the word">${esc(state.word)}</div><p class="copy-help">Open your eyes and compare the word with the spelling you said.</p><button class="btn primary finish-word" type="button" data-action="complete">Finish this word ✓</button>`:`<button class="btn" type="button" data-action="confirm-close">Tutor confirms spoken spelling</button>`}`}
    function row(i){const status=i<state.step?'done':i===state.step?'active':'locked';let summary=state.step>i?'Complete ✓':i===state.step?'Your turn':'Up next';let body='';if(i===0&&state.step===0)body=traceRow();if(i===1&&state.step===1)body=copyRow();if(i===2&&state.step===2)body=coverRow();if(i===3&&state.step===3)body=closeRow();return `<section class="step-row ${status}" aria-current="${i===state.step?'step':'false'}"><div class="step-aside"><span class="step-number">${i<state.step?'✓':i+1}</span><div><div class="step-title">${steps[i][0]}</div><div class="step-sub">${steps[i][1]}</div></div></div><div class="step-content">${body||`<p>${summary}</p>`}</div></section>`}
    function render(){document.getElementById('newWord').hidden=false;const pct=Math.round(state.step/4*100);app.innerHTML=`<div class="progress-wrap"><span class="progress-label">Step ${Math.min(state.step+1,4)} of 4</span><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${state.step}"><span style="width:${pct}%"></span></div></div>${wordBanner()}${state.step===0?spokenCheck():''}<div class="steps">${steps.map((_,i)=>row(i)).join('')}</div>`;bind()}
    function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{switch(b.dataset.action){case'confirm-read':state.spoken=true;render();break;case'trace':{if(state.animating!==null||!state.spoken)break;state.animating=state.trace;render();setTimeout(()=>{state.trace++;state.animating=null;render()},850);break}case'next':state.step=1;render();break;case'retry-cover':state.coverChecked=true;state.coverCorrected=false;state.coverValue='';render();document.getElementById('coverInput')?.focus();break;case'confirm-close':state.closeSpoken=true;render();break;case'complete':app.innerHTML=`<section class="card setup" style="text-align:center"><div style="font-size:50px;margin:0 0 12px" aria-hidden="true">✦</div><div class="eyebrow">Word practice complete</div><h2 style="margin:9px 0">${esc(state.word)}</h2><p>Nice work. The learner traced, copied, recalled, and said the word aloud with tutor feedback.</p><button class="btn primary" type="button" id="again">Practise another word</button></section>`;document.getElementById('again').onclick=setup;break}}}));
      document.querySelectorAll('[data-form]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();if(form.dataset.form==='copy'){state.copyValue=document.getElementById('copyInput').value.trim().toLowerCase();if(state.copyValue===state.word){state.step=2;render()}else{render();document.getElementById('copyInput')?.focus()}}else{state.coverValue=document.getElementById('coverInput').value.trim().toLowerCase();state.coverChecked=true;if(state.coverValue===state.word){state.coverCorrected=true;state.step=3;render()}else{state.coverCorrected=false;render();document.getElementById('coverInput')?.focus()}}}));}
    document.getElementById('newWord').addEventListener('click',setup);setup();
  })();
  </script>
</body>
</html>
